version: '3.8'

# ============================================
# Docker Compose untuk VM WINDOWS 10 (Frontend)
# ============================================
# PENTING: Ganti IP_UBUNTU_SERVER di bawah dengan
# IP address Ubuntu Server kamu yang sebenarnya!
# Cek IP di Ubuntu dengan: hostname -I
# ============================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # ⚠️ GANTI IP INI dengan IP Ubuntu Server kamu!
        VITE_API_URL: http://192.168.1.100:3000
    container_name: printpoint_web
    restart: unless-stopped
    ports:
      - "80:80"
