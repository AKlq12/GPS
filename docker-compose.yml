version: '3.8'

services:
  web:
    image: node:20-alpine
    container_name: printpoint_web
    working_dir: /app
    volumes:
      - .:/app
      # Hindari mount node_modules dari host ke dalam container
      - /app/node_modules
    ports:
      - "5173:5173"
    # Menjalankan instalasi dependency dan server development Vite
    # --host diperlukan agar Vite bisa diakses dari luar container Docker
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      # Sangat berguna untuk hot-reload di Windows
      - CHOKIDAR_USEPOLLING=true
